<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add User</title>
</head>
<body>
<h1>Add New User</h1>

<!-- Form submit tới API /add -->
<form action="/add" method="post">
    <!-- CSRF Token -->
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

    <!-- Common Name (CN) -->
    <label for="cn">Common Name (CN):</label>
    <input type="text" id="cn" name="cn" required>
    <br>

    <!-- Surname (SN) -->
    <label for="sn">Surname (SN):</label>
    <input type="text" id="sn" name="sn" required>
    <br>

    <!-- Username (UID) -->
    <label for="username">Username:</label>
    <input type="text" id="username" name="username" required>
    <br>

    <!-- Password -->
    <label for="password">Password:</label>
    <input type="password" id="password" name="password" required>
    <br>

    <!-- Face Embedding (Hiện không bắt buộc) -->
    <label for="faceEmbedding">Face Embedding (Optional):</label>
    <input type="text" id="faceEmbedding" name="faceEmbedding">
    <br>

    <!-- Submit Button -->
    <button type="submit">Add User</button>
</form>

</body>
</html>
